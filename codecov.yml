# Reference: https://docs.codecov.com/docs/codecovyml-reference
# ----------------------
codecov:
  require_ci_to_pass: true

# Coverage configuration
# ----------------------
coverage:
  status:
    patch: false
  range: 70..90 # The First number represents red, and the second represents green
  # (default is 70..100)
  round: down # up, down, or nearest
  precision: 2 # Number of decimal places, between 0 and 5

# Flag Management - Simple carryforward for everything
# ----------------------
flag_management:
  default_rules:
    carryforward: true # This keeps coverage from previous uploads
    statuses:
      - type: project
        target: auto
        threshold: 2%

# Ignoring Paths
# --------------
# which folders/files to ignore
ignore:
  - ".github/**"
  - ".mage-cache/**"
  - ".vscode/**"
  - "bin/**"
  - "docs/**" # example programs — no tests, always 0% (matches Sonar coverage exclusion)
  - "example/**"
  - "examples/**"
  - "mocks/**"
  - "testing/**"
  # Test infrastructure & fixtures. These live in non-_test.go files so the helpers can be
  # shared across packages' tests (e.g. wallet.NewTestWalletForRandomKey, registry.MockRegistry),
  # which is why go/codecov instrument them. Sonar already excludes all of these via its
  # `**test**` glob (sonar-project.properties); this mirrors that policy for Codecov.
  - "**/testdata/**"
  - "**/test_util/**"
  - "**/test_cert_util/**"
  - "**/testcertificates/**"
  - "**/test_wallet.go"
  - "**/test_logger.go"
  - "**/mock.go"

# Parsers
# --------------
parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

# Pull request comments:
# ----------------------
# Diff is the Coverage Diff of the pull request.
# Files are the files impacted by the pull request
comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
